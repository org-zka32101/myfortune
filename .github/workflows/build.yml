name: iOS Build & Test CI/CD

on:
  push:
    branches: [ main, develop, claude/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # 毎日午前2時 (UTC) にビルド
    - cron: '0 2 * * *'

env:
  XCODE_VERSION: '15.0'
  IOS_VERSION: '14.0'
  SWIFT_VERSION: '5.9'

jobs:
  # ✅ Job 1: コード品質チェック
  code-quality:
    name: Code Quality Check
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0'

      - name: Install SwiftLint
        run: |
          brew install swiftlint

      - name: Run SwiftLint
        run: |
          swiftlint --version
          swiftlint myfortune --strict || true
        continue-on-error: true

  # ✅ Job 2: ビルドテスト
  build:
    name: Build & Test
    runs-on: macos-latest
    needs: code-quality
    strategy:
      matrix:
        include:
          - scheme: myfortune
            destination: generic/platform=iOS Simulator
            sdk: iphonesimulator
            config: Debug
          - scheme: myfortune
            destination: generic/platform=iOS
            sdk: iphoneos
            config: Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0'

      - name: Install CocoaPods
        run: |
          gem install cocoapods --user-install
          pod install
        working-directory: ${{ github.workspace }}

      - name: Cache CocoaPods
        uses: actions/cache@v3
        with:
          path: Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Build for ${{ matrix.config }}
        run: |
          xcodebuild \
            -workspace myfortune.xcworkspace \
            -scheme ${{ matrix.scheme }} \
            -configuration ${{ matrix.config }} \
            -sdk ${{ matrix.sdk }} \
            -derivedDataPath Build/${{ matrix.config }} \
            -verbose

      - name: Collect build logs
        if: failure()
        run: |
          find . -name "*.log" -o -name "*.xcactivitylog" | head -10

  # ✅ Job 3: ユニットテスト
  unit-tests:
    name: Unit Tests
    runs-on: macos-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0'

      - name: Install dependencies
        run: |
          gem install cocoapods --user-install
          pod install

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -workspace myfortune.xcworkspace \
            -scheme myfortune \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath Build/Debug \
            -resultBundlePath TestResults \
            -verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: TestResults

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit Test Results
          path: 'TestResults/Info.plist'
          reporter: 'java-junit'
        continue-on-error: true

  # ✅ Job 4: セキュリティスキャン
  security-scan:
    name: Security Scan
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Run secret scanning
        run: |
          echo "Scanning for secrets..."
          git log -p | grep -E "password|secret|token|key" || true
        continue-on-error: true

  # ✅ Job 5: コードカバレッジ
  code-coverage:
    name: Code Coverage
    runs-on: macos-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0'

      - name: Install dependencies
        run: |
          gem install cocoapods --user-install
          pod install

      - name: Run tests with coverage
        run: |
          xcodebuild test \
            -workspace myfortune.xcworkspace \
            -scheme myfortune \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath Build/Coverage \
            -enableCodeCoverage YES \
            -resultBundlePath CoverageResults

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./CoverageResults
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  # ✅ Job 6: アーティファクト生成
  artifacts:
    name: Generate Artifacts
    runs-on: macos-latest
    needs: build
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0'

      - name: Install dependencies
        run: |
          gem install cocoapods --user-install
          pod install

      - name: Create build info file
        run: |
          mkdir -p Build/Artifacts
          cat > Build/Artifacts/BUILD_INFO.txt << EOF
          Project: myfortune
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Build Date: $(date)
          Runner: ${{ runner.os }}
          EOF

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: Build/
          retention-days: 30

  # ✅ Final Status Check
  status-check:
    name: Status Check
    runs-on: ubuntu-latest
    needs: [code-quality, build, unit-tests, security-scan, code-coverage, artifacts]
    if: always()

    steps:
      - name: Check job status
        run: |
          echo "✅ Code Quality: ${{ needs.code-quality.result }}"
          echo "✅ Build: ${{ needs.build.result }}"
          echo "✅ Tests: ${{ needs.unit-tests.result }}"
          echo "✅ Security: ${{ needs.security-scan.result }}"
          echo "✅ Coverage: ${{ needs.code-coverage.result }}"
          echo "✅ Artifacts: ${{ needs.artifacts.result }}"

      - name: Notify status
        if: failure()
        run: |
          echo "❌ Pipeline failed! Check logs for details."
          exit 1

  # ✅ Job 7: PR コメント（PullRequest時のみ）
  pr-comment:
    name: PR Comment
    runs-on: ubuntu-latest
    needs: [build, unit-tests]
    if: github.event_name == 'pull_request' && success()

    steps:
      - name: Download test results
        uses: actions/download-artifact@v3
        with:
          name: test-results
        continue-on-error: true

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Build & Test Passed!\n\n- ✅ Code Quality Check\n- ✅ iOS Build (Simulator)\n- ✅ iOS Build (Device)\n- ✅ Unit Tests\n- ✅ Security Scan\n- ✅ Code Coverage`
            })
        continue-on-error: true
