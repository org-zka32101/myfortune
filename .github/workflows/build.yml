name: iOS Build

on:
  push:
    branches: [ main, develop, claude/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Install dependencies
      run: |
        cd myfortune
        pod install

    - name: Build for iOS
      run: |
        cd myfortune
        xcodebuild \
          -workspace myfortune.xcworkspace \
          -scheme myfortune \
          -configuration Debug \
          -sdk iphonesimulator \
          -derivedDataPath Build/Debug

    - name: Run tests
      run: |
        cd myfortune
        xcodebuild test \
          -workspace myfortune.xcworkspace \
          -scheme myfortune \
          -configuration Debug \
          -sdk iphonesimulator \
          -derivedDataPath Build/Debug

    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts
        path: myfortune/Build/Debug
