name: Android Build & Test CI/CD

on:
  push:
    branches: [ main, develop, claude/* ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # google-services.json is gitignored (see docs/android-setup.md) since it's
      # per-developer/per-project config. If the ANDROID_GOOGLE_SERVICES_JSON
      # repository secret is set (Settings -> Secrets and variables -> Actions),
      # the real file is used so the build is fully functional (AI fortune
      # fetch, App Check). Otherwise fall back to a placeholder that only
      # satisfies the google-services plugin's parser, so builds/tests/lint
      # still run without the real Firebase project.
      - name: Write google-services.json
        env:
          REAL_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$REAL_GOOGLE_SERVICES_JSON" ]; then
            echo "Using real google-services.json from the ANDROID_GOOGLE_SERVICES_JSON secret"
            echo "$REAL_GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "ANDROID_GOOGLE_SERVICES_JSON secret not set — using CI placeholder (see docs/android-setup.md)"
            cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "myfortune-ci-placeholder",
              "storage_bucket": "myfortune-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.yourwish.cometrueaifortune" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaCiPlaceholderPlaceholderPlaceholder00" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: myfortune-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  release-bundle:
    name: Build signed release AAB
    runs-on: ubuntu-latest
    # Runs on real pushes to main/develop/claude/*, or manually via
    # workflow_dispatch — never on pull_request (no release builds from PRs).
    # The `secrets` context can't be referenced in a job-level `if:`, so
    # whether the signing secrets are configured is checked in the first
    # step below instead, and every other step is gated on its output.
    if: ${{ github.event_name != 'pull_request' }}
    defaults:
      run:
        working-directory: android

    steps:
      - name: Check signing secrets are configured
        id: check
        env:
          KEYSTORE_SECRET: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_SECRET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANDROID_KEYSTORE_BASE64 not set — skipping release AAB build (see docs/android-setup.md)."
          fi

      - name: Checkout code
        if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.check.outputs.configured == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Write google-services.json
        if: steps.check.outputs.configured == 'true'
        env:
          REAL_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$REAL_GOOGLE_SERVICES_JSON" ]; then
            echo "$REAL_GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "::error::ANDROID_GOOGLE_SERVICES_JSON secret not set — cannot build a real release bundle."
            exit 1
          fi

      # The keystore itself never touches the repo or an artifact — it's
      # decoded into the runner's temp workspace for this job only and never
      # uploaded anywhere.
      - name: Decode release keystore
        if: steps.check.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release AAB
        if: steps.check.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Remove decoded keystore
        if: always() && steps.check.outputs.configured == 'true'
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload release AAB
        if: steps.check.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: myfortune-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 90
